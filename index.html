<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Coordenação Dainara - Moldura RC/DS</title>
  <style>
    :root{font-family:"Trebuchet MS",Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#44244f;background:#fff8fd;--pink:#ff4fa3;--pink-dark:#e82d8b;--lilac:#a56bdf;--lilac-soft:#ead9ff;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 12%,#ffd8ec 0 8%,transparent 26%),radial-gradient(circle at 88% 18%,#e7d4ff 0 9%,transparent 28%),linear-gradient(145deg,#fffafd,#f9f2ff 52%,#fff);overflow-x:hidden}body:before,body:after{position:fixed;z-index:-1;color:#ff90c4;opacity:.38;font-size:clamp(5rem,12vw,10rem);filter:blur(.2px)}body:before{content:"♡";left:-18px;top:18%}body:after{content:"✦";right:3%;bottom:2%;color:#b689ef}main{width:min(1040px,100%);margin:auto;padding:34px 20px 56px}header{text-align:center;margin-bottom:28px;position:relative}header:before{content:"♡  FEITO COM CARINHO  ♡";display:inline-block;margin-bottom:10px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #ffd1e7;color:#e8398e;font-size:.72rem;font-weight:900;letter-spacing:.12em;box-shadow:0 6px 18px #ef7db528}h1{margin:0;font-size:clamp(1.65rem,4.5vw,2.65rem);line-height:1.08;color:#51235f;text-shadow:0 3px 0 #fff}header p{color:#8a5d8e;margin:12px 0 0;font-weight:600}.layout{display:grid;grid-template-columns:minmax(280px,590px) minmax(270px,1fr);gap:28px;align-items:start}.stage{position:relative;aspect-ratio:1;overflow:hidden;border-radius:34px;background:#fff;box-shadow:0 22px 55px #8b4ca52a,0 0 0 7px #fff,0 0 0 9px #f4c8e5;touch-action:none;cursor:grab}.stage:after{content:"✦";position:absolute;right:13px;top:11px;color:#fff;font-size:1.6rem;text-shadow:0 2px 8px #7d456d88;pointer-events:none}.stage:active{cursor:grabbing}.stage canvas{width:100%;height:100%;display:block}.panel{background:#ffffffde;border:2px solid #f2d8f1;border-radius:30px;padding:22px;box-shadow:0 18px 44px #7c4b9220;backdrop-filter:blur(12px);position:relative}.panel:before{content:"♡";position:absolute;right:18px;top:13px;color:#ff71b4;font-size:1.35rem}.panel h2{margin:0 0 16px;font-size:1rem;color:#67316e}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:22px}.frame{border:3px solid transparent;border-radius:18px;padding:5px;background:linear-gradient(145deg,#fff,#f6ebff);cursor:pointer;box-shadow:0 5px 12px #8f5ca51a;transition:.2s ease}.frame:hover{transform:translateY(-3px);box-shadow:0 8px 16px #d55d9c32}.frame.active{border-color:var(--pink);background:#fff0f8;box-shadow:0 0 0 3px #ffd5e9}.frame img{width:100%;display:block;border-radius:12px;background:repeating-conic-gradient(#f5edf7 0 25%,#fff 0 50%) 0/12px 12px}.upload{display:block;text-align:center;padding:15px;background:linear-gradient(135deg,var(--pink),var(--lilac));color:#fff;border-radius:17px;font-weight:900;cursor:pointer;margin-bottom:20px;box-shadow:0 9px 20px #d84d9938;transition:.2s ease}.upload:before{content:"♡ ";font-size:1.1rem}.upload:hover{transform:translateY(-2px);filter:saturate(1.08)}.upload input{display:none}label.range{display:block;font-weight:900;font-size:.9rem;color:#67316e}input[type=range]{width:100%;accent-color:var(--pink);margin:12px 0 20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{border:0;border-radius:15px;padding:13px;font-weight:800;cursor:pointer;transition:.2s ease}.secondary{background:#f2e6fb;color:#61366d;border:1px solid #ead4f6}.secondary:hover{background:#ead5f8;transform:translateY(-2px)}.primary{grid-column:1/-1;background:linear-gradient(135deg,#ff4fa3,#9b5de5);color:#fff;font-size:1rem;box-shadow:0 9px 20px #c94b9a35}.primary:before{content:"✦ ";}.primary:hover{transform:translateY(-2px);filter:brightness(1.04)}.hint{text-align:center;color:#936d94;font-size:.82rem;line-height:1.35;margin:16px 0 0;padding:11px 12px;background:#fff6fb;border-radius:14px;border:1px dashed #efc4df}@media(max-width:760px){main{padding:24px 16px 44px}.layout{grid-template-columns:1fr;gap:24px}.panel{padding:18px;border-radius:26px}.stage{border-radius:28px}header:before{font-size:.65rem}}
  </style>
</head>
<body><main>
  <header><h1>Coordenação Dainara - Moldura RC/DS</h1><p>Coloque sua foto, escolha a moldura e baixe sua imagem pronta.</p></header>
  <section class="layout">
    <div class="stage" id="stage"><canvas id="canvas" width="1200" height="1200"></canvas></div>
    <aside class="panel">
      <h2>1. Escolha a moldura</h2><div class="frames" id="frames"></div>
      <label class="upload">2. Escolher minha foto<input id="file" type="file" accept="image/*"></label>
      <label class="range">3. Ajuste o zoom<input id="zoom" type="range" min="0.3" max="4" step="0.01" value="1"></label>
      <div class="actions"><button class="secondary" id="fit">Ajustar foto</button><button class="secondary" id="center">Centralizar</button><button class="primary" id="download">Baixar foto pronta</button></div>
      <p class="hint">Arraste a foto para reposicionar. Sua imagem não é enviada para nenhum servidor.</p>
    </aside>
  </section>
  <script>
  const choices=[['Dourada','moldura-dourada-v2.png','#d99d08'],['Roxa','moldura-roxa.png','#7200d9'],['Azul','moldura-azul.png','#0738d9'],['Rosa','moldura-rosa.png','#f50073']];
  const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),zoom=document.querySelector('#zoom');
  let photo=null,frame=new Image(),frameColor=choices[0][2],scale=1,x=600,y=600,drag=false,last={x:0,y:0};
  function draw(){ctx.clearRect(0,0,1200,1200);ctx.fillStyle=frameColor;ctx.fillRect(0,0,1200,1200);ctx.save();ctx.beginPath();ctx.arc(600,600,520,0,Math.PI*2);ctx.clip();ctx.fillStyle='#ece9f0';ctx.fillRect(0,0,1200,1200);if(photo){const w=photo.naturalWidth*scale,h=photo.naturalHeight*scale;ctx.drawImage(photo,x-w/2,y-h/2,w,h)}ctx.restore();if(frame.complete)ctx.drawImage(frame,0,0,1200,1200)}
  function fit(){if(!photo)return;scale=Math.max(1200/photo.naturalWidth,1200/photo.naturalHeight);zoom.value=Math.min(4,Math.max(.3,scale));x=y=600;draw()}
  choices.forEach(([name,src,color],i)=>{const b=document.createElement('button');b.className='frame'+(i===0?' active':'');b.title=name;b.innerHTML=`<img src="${src}" alt="Moldura ${name}">`;b.onclick=()=>{document.querySelectorAll('.frame').forEach(el=>el.classList.remove('active'));b.classList.add('active');frameColor=color;frame.src=src};document.querySelector('#frames').append(b)});frame.onload=draw;frame.src=choices[0][1];
  document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{photo=im;fit();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
  zoom.oninput=()=>{scale=+zoom.value;draw()};document.querySelector('#fit').onclick=fit;document.querySelector('#center').onclick=()=>{x=y=600;draw()};
  function point(e){const r=stage.getBoundingClientRect(),p=e.touches?.[0]||e;return{x:(p.clientX-r.left)*1200/r.width,y:(p.clientY-r.top)*1200/r.height}}
  stage.onpointerdown=e=>{if(!photo)return;drag=true;last=point(e);stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(!drag)return;const p=point(e);x+=p.x-last.x;y+=p.y-last.y;last=p;draw()};stage.onpointerup=()=>drag=false;
  document.querySelector('#download').onclick=async()=>{if(!photo){alert('Escolha uma foto primeiro.');return}canvas.toBlob(async blob=>{const file=new File([blob],'foto-com-moldura.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Foto com moldura'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};draw();
  </script>
</main></body></html>
